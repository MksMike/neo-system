packages:
  - apps/*
  - packages/*

# Supply-chain protection (ADR 0023). Neither setting pins a version:
# - refuse a package whose trust evidence got weaker than in earlier versions;
# - refuse sub-dependencies from git or tarball URLs.
trustPolicy: no-downgrade
# semver@6.3.1 (via @babel/core, used by Next.js) is the official 2023 security backport of the 6.x line,
# published by the npm team without provenance, so it reads as a trust downgrade. Exclude only this version.
trustPolicyExclude:
  - semver@6.3.1
blockExoticSubdeps: true

# Install scripts of dependencies only run if listed here as true (ADR 0023).
# @parcel/watcher and @swc/core come through next-intl and ship prebuilt binaries;
# their scripts only compile from source as a fallback.
allowBuilds:
  '@parcel/watcher': false
  '@swc/core': false
