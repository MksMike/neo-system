packages:
  - apps/*
  - packages/*

# Single source of versions for the whole monorepo. Packages reference them with "catalog:".
# typescript stays on 6.0.x until typescript-eslint supports 7.x (peer range is <6.1).
catalog:
  '@eslint/js': 10.0.1
  '@types/node': 26.6.5
  eslint: 10.13.0
  eslint-config-prettier: 10.1.8
  globals: 17.13.0
  prettier: 3.9.10
  turbo: 2.11.10
  typescript: 6.0.3
  typescript-eslint: 8.72.1
  vitest: 5.0.5
