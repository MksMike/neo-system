# CI em todo PR e em cada push na main (ADR 0017 e ADR 0023).
# A main não tem proteção no plano gratuito: nunca faça merge com o CI vermelho.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Formato, lint, tipos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  security:
    name: Segurança (segredos, análise estática, dependências)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Segredos no código e no histórico (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Análise estática de segurança (Semgrep, regras OWASP)
        run: >
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep
          semgrep scan --metrics=off --error
          --config p/owasp-top-ten --config p/typescript --config p/react --config p/nextjs
          --exclude docs --exclude pnpm-lock.yaml
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Vulnerabilidades nas dependências (pnpm audit)
        run: pnpm audit --audit-level high
