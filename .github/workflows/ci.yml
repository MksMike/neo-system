# CI em todo PR e em cada push na main (ADR 0017 e ADR 0023).
# A main não tem proteção no plano gratuito: nunca faça merge com o CI vermelho.
# Actions referenciadas por commit (SHA), não por tag: tag pode ser movida. O Dependabot atualiza.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Formato, lint, tipos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  security:
    name: Segurança (segredos, análise estática, dependências)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Segredos no código e no histórico (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Decisão do Mike (28/10/2026): instalar sempre a versão mais nova, sem período de espera
      # (minimumReleaseAge no pnpm, cooldown no Dependabot). As duas regras do Semgrep sobre isso ficam desligadas.
      - name: Análise estática de segurança (Semgrep, regras OWASP)
        run: >
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep
          semgrep scan --metrics=off --error
          --config p/owasp-top-ten --config p/typescript --config p/react --config p/nextjs
          --exclude docs --exclude pnpm-lock.yaml
          --exclude-rule package_managers.pnpm.pnpm-missing-minimum-release-age.pnpm-minimum-release-age
          --exclude-rule package_managers.dependabot.dependabot-missing-cooldown.dependabot-missing-cooldown
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Vulnerabilidades nas dependências (pnpm audit)
        run: pnpm audit --audit-level high
