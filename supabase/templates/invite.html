<!doctype html>
<html lang="ja">
  <body
    style="
      margin: 0;
      padding: 24px;
      background: #eceff4;
      font-family: 'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic UI', Arial, sans-serif;
      color: #0f172a;
    "
  >
    <table
      role="presentation"
      width="100%"
      style="
        max-width: 520px;
        margin: 0 auto;
        background: #ffffff;
        border: 1px solid #d3dae5;
        border-radius: 16px;
      "
    >
      <tr>
        <td style="padding: 28px">
          <div
            style="
              display: inline-block;
              padding: 8px 10px;
              border-radius: 10px;
              background: #1e3a8a;
              color: #ffffff;
              font-weight: 700;
              font-size: 13px;
            "
          >
            NEO
          </div>
          <h1 style="font-size: 20px; line-height: 28px; margin: 16px 0 8px">NEO-SYSTEM</h1>
          <p style="margin: 0 0 8px; line-height: 22px">
            NEO-SYSTEM に招待されました。下のボタンからパスワードを設定してください。
          </p>
          <p style="margin: 0 0 20px; line-height: 22px; color: #475066">
            Você recebeu um convite para o NEO-SYSTEM. Use o botão abaixo para definir sua senha.
          </p>
          <p style="margin: 0 0 20px">
            <a
              href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=invite"
              style="
                display: inline-block;
                padding: 12px 20px;
                border-radius: 10px;
                background: #1e3a8a;
                color: #ffffff;
                text-decoration: none;
                font-weight: 600;
              "
            >
              パスワードを設定 / Definir senha
            </a>
          </p>
          <p style="margin: 0; font-size: 12px; line-height: 16px; color: #5e6779">
            このリンクは一度だけ使えます。心当たりがない場合は、このメールを無視してください。<br />
            Este link vale uma vez só. Se você não esperava este convite, ignore este e-mail.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
